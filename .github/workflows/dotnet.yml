name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0          # MinVer reads the version from tags

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore
      run: dotnet restore JsonCall.slnx

    - name: Build
      run: dotnet build JsonCall.slnx --no-restore --configuration Debug

    # Unit tests plus the Gherkin specs. Specs without step definitions are
    # reported as skipped; the skipped count is the unimplemented-spec backlog.
    - name: Test
      run: >
        dotnet test JsonCall.slnx --no-build --configuration Debug
        --logger "trx;LogFileName=results.trx"
        --logger "console;verbosity=normal"
        --results-directory ./TestResults

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: TestResults/**/*.trx

  docs:
    runs-on: ubuntu-latest
    env:
      OKF_VERSION: 0.5.2
      OKF_SHA256: 05ecf191f1ef1396cdeefa9a1fd877d491b32b91f2a4a4d06393656e880e90b6

    steps:
    - uses: actions/checkout@v4

    - name: Install okf
      run: |
        curl -fsSLo okf.tar.gz "https://github.com/okfcli/okf/releases/download/v${OKF_VERSION}/okf_${OKF_VERSION}_linux_amd64.tar.gz"
        echo "${OKF_SHA256}  okf.tar.gz" | sha256sum -c -
        tar -xzf okf.tar.gz okf && sudo mv okf /usr/local/bin/okf && rm okf.tar.gz

    # The indexes are generated; fail if someone edited a doc without regenerating them.
    - name: Indexes are current
      run: okf index docs > /dev/null && git diff --exit-code -- docs

    - name: Validate knowledge bundle
      run: okf validate docs

  # Every push to main publishes its MinVer height version (such as 0.1.1-preview.0.5) to GitHub Packages, so a
  # change can be tried before it is released. nuget.org only receives tagged releases (release.yml). See
  # docs/decisions/0011-only-release-tags-publish.md.
  preview:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ build, docs ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0          # MinVer reads the version from tags

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Pack
      run: dotnet pack JsonCall.slnx --configuration Release --output ./artifacts

    # A commit that is already tagged is a release; release.yml publishes it.
    - name: Push to GitHub Packages
      run: |
        if ls ./artifacts/*.nupkg | grep -qv -- '-preview\.'; then
          echo "Commit is tagged as a release; nothing to publish here."
          exit 0
        fi
        dotnet nuget push "./artifacts/*.nupkg" \
          --api-key "${{ secrets.GITHUB_TOKEN }}" \
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
          --skip-duplicate
