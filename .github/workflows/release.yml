name: Release

# Pushing a release tag such as v0.1.0 or v1.2.3 builds, tests and packs that commit, publishes the packages to
# NuGet and creates the GitHub Release. MinVer turns the tag into the package version. Only complete versions
# publish: a tag with a suffix (v1.0.0-rc.1) does not match and runs nothing. See
# docs/decisions/0011-only-release-tags-publish.md.

on:
  push:
    tags: [ "v[0-9]+.[0-9]+.[0-9]+" ]

permissions:
  contents: write               # create the GitHub Release
  id-token: write               # NuGet trusted publishing (OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    environment: nuget          # add required reviewers in Settings > Environments to approve each publish

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore
      run: dotnet restore JsonCall.slnx

    - name: Build
      run: dotnet build JsonCall.slnx --no-restore --configuration Release

    - name: Test
      run: dotnet test JsonCall.slnx --no-build --configuration Release

    - name: Pack
      run: dotnet pack JsonCall.slnx --no-build --configuration Release --output ./artifacts

    # Fail before publishing anything if the tag is not a complete version, or MinVer did not take the version from it.
    - name: Check version matches tag
      run: |
        if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::${GITHUB_REF_NAME} is not a release tag (vMAJOR.MINOR.PATCH)"; exit 1
        fi
        expected="${GITHUB_REF_NAME#v}"
        for pkg in ./artifacts/*.nupkg; do
          case "$(basename "$pkg")" in
            *".${expected}.nupkg") ;;
            *) echo "::error::$(basename "$pkg") does not match tag ${GITHUB_REF_NAME}"; exit 1 ;;
          esac
        done

    - name: NuGet login (trusted publishing)
      uses: NuGet/login@v1
      id: nuget
      with:
        user: ${{ vars.NUGET_USER }}

    - name: Push to NuGet
      run: >
        dotnet nuget push "./artifacts/*.nupkg"
        --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}"
        --source https://api.nuget.org/v3/index.json
        --skip-duplicate

    # Notes are generated from merged pull requests and closed issues; edit them on GitHub afterwards.
    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release create "$GITHUB_REF_NAME" ./artifacts/*.nupkg --verify-tag --generate-notes
